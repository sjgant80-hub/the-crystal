name: gate
# The Crystal is gated like every cell: tests, a mutation witness that must be CLEAN on every gated file with the counts
# committed in data/gates.json, The Climb's sealed kernels compared byte for byte with that repository, every
# published run decided again from its recorded replies, and its own birth check through the estate genome action.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tests (including the seal and the page build)
        run: node --test test/*.test.mjs
      - name: mutation gate, every gated file CLEAN, counts as committed
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness
          node scripts/gates.mjs --witness .witness/witness.mjs --check
      - name: the seed is The Climb, byte for byte as its seal froze it
        run: node scripts/vendor-climb.mjs --check
      - name: the seed crystal is every checked step of The Climb's sealed run, made again from that repository
        run: node scripts/make-seed.mjs --check
      - name: every published run is complete, under the seal where it must be, and decided again identically
        run: node scripts/publish.mjs --check
  genome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: sjgant80-hub/estate-genome@v1
